#cloud-config
# Spark VM: Spark Standalone Master + Worker + blobfuse2
# Variables inyectadas por Terraform templatefile():
#   ${storage_account_name}  ${storage_account_key}  ${container_name}
#
# NOTA: En las secciones de shell (runcmd) los $ de variables shell se
# escapan como $$ para que Terraform no los interpole.

package_update: true
package_upgrade: false

packages:
  - openjdk-17-jdk-headless
  - fuse3
  - curl
  - wget
  - lsb-release

write_files:
  # Configuración de blobfuse2 (usa variables Terraform ${...})
  - path: /etc/blobfuse2/config.yaml
    permissions: "0600"
    content: |
      logging:
        type: syslog
        level: log_warning
      components:
        - libfuse
        - file_cache
        - attr_cache
        - azstorage
      libfuse:
        attribute-expiration-sec: 120
        entry-expiration-sec: 120
        negative-entry-expiration-sec: 240
        allow-other: true
      file_cache:
        path: /tmp/blobfuse2_cache
        timeout-sec: 120
        max-size-mb: 8192
      attr_cache:
        timeout-sec: 7200
      azstorage:
        type: block
        account-name: ${storage_account_name}
        account-key: ${storage_account_key}
        endpoint: https://${storage_account_name}.blob.core.windows.net
        mode: key
        container: ${container_name}

  # Servicio systemd para blobfuse2
  - path: /etc/systemd/system/blobfuse2.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Azure Blob Storage FUSE mount (/mnt/data)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=forking
      ExecStartPre=/bin/mkdir -p /mnt/data /tmp/blobfuse2_cache
      ExecStart=/usr/bin/blobfuse2 mount /mnt/data \
          --config-file=/etc/blobfuse2/config.yaml \
          --allow-other \
          --background-download
      ExecStop=/bin/fusermount3 -u /mnt/data
      Restart=on-failure
      RestartSec=15

      [Install]
      WantedBy=multi-user.target

  # Servicio systemd para Spark Master
  - path: /etc/systemd/system/spark-master.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Apache Spark Master
      After=network-online.target blobfuse2.service
      Wants=network-online.target

      [Service]
      Type=forking
      User=root
      Environment="SPARK_HOME=/opt/spark"
      Environment="JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
      ExecStartPre=/bin/mkdir -p /var/log/spark /var/run/spark
      ExecStart=/opt/spark/sbin/start-master.sh
      ExecStop=/opt/spark/sbin/stop-master.sh
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

  # Servicio systemd para Spark Worker
  - path: /etc/systemd/system/spark-worker.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Apache Spark Worker
      After=spark-master.service
      Wants=spark-master.service

      [Service]
      Type=forking
      User=root
      Environment="SPARK_HOME=/opt/spark"
      Environment="JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64"
      ExecStartPre=/bin/mkdir -p /var/log/spark /var/run/spark
      ExecStart=/opt/spark/sbin/start-worker.sh spark://localhost:7077
      ExecStop=/opt/spark/sbin/stop-worker.sh
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target

runcmd:
  # ── Instalar blobfuse2 desde el repositorio de Microsoft ─────────────
  # $${DISTRO} se convierte en ${DISTRO} en la VM (escape de Terraform)
  - |
    DISTRO=$$(lsb_release -cs)
    curl -sL https://packages.microsoft.com/keys/microsoft.asc \
      | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] \
      https://packages.microsoft.com/repos/microsoft-ubuntu-$${DISTRO}-prod \
      $${DISTRO} main" > /etc/apt/sources.list.d/microsoft.list
    apt-get update -qq
    apt-get install -y blobfuse2

  # ── Instalar Spark 3.5.3 ─────────────────────────────────────────────
  - |
    SPARK_VER=3.5.3
    SPARK_PKG=spark-$${SPARK_VER}-bin-hadoop3
    wget -q https://downloads.apache.org/spark/$${SPARK_VER}/$${SPARK_PKG}.tgz \
      -O /tmp/$${SPARK_PKG}.tgz
    tar xzf /tmp/$${SPARK_PKG}.tgz -C /opt
    ln -sfn /opt/$${SPARK_PKG} /opt/spark
    rm /tmp/$${SPARK_PKG}.tgz

  # Variables de entorno globales
  - echo "export SPARK_HOME=/opt/spark" >> /etc/environment
  - echo "export PATH=\$PATH:/opt/spark/bin:/opt/spark/sbin" >> /etc/environment
  - |
    JAVA_HOME=$$(readlink -f /usr/bin/java | sed 's|/bin/java||')
    echo "export JAVA_HOME=$${JAVA_HOME}" >> /etc/environment

  # ── Escribir spark-env.sh DESPUÉS de que /opt/spark exista ───────────
  - |
    JAVA_HOME=$$(readlink -f /usr/bin/java | sed 's|/bin/java||')
    NCORES=$$(nproc)
    cat > /opt/spark/conf/spark-env.sh << ENVEOF
    export JAVA_HOME=$${JAVA_HOME}
    export SPARK_HOME=/opt/spark
    export SPARK_WORKER_CORES=$${NCORES}
    export SPARK_WORKER_MEMORY=12g
    export SPARK_MASTER_HOST=0.0.0.0
    export SPARK_LOG_DIR=/var/log/spark
    export SPARK_PID_DIR=/var/run/spark
    ENVEOF
    chmod 755 /opt/spark/conf/spark-env.sh

  # ── spark-defaults.conf ───────────────────────────────────────────────
  - |
    cat > /opt/spark/conf/spark-defaults.conf << CONFEOF
    spark.sql.files.maxPartitionBytes   134217728
    spark.sql.shuffle.partitions        8
    spark.serializer                    org.apache.spark.serializer.KryoSerializer
    spark.eventLog.enabled              false
    CONFEOF

  # Crear directorios de logs y PIDs
  - mkdir -p /var/log/spark /var/run/spark
  - chmod 777 /var/log/spark /var/run/spark

  # ── Montar blobfuse2 ─────────────────────────────────────────────────
  - mkdir -p /mnt/data /tmp/blobfuse2_cache
  - chmod 755 /mnt/data
  - systemctl daemon-reload
  - systemctl enable blobfuse2.service
  - systemctl start blobfuse2.service

  # Esperar montaje (máx 30 s)
  - |
    for i in $$(seq 1 30); do
      mountpoint -q /mnt/data && break
      sleep 1
    done
    mountpoint -q /mnt/data || (echo "ERROR: /mnt/data no montado" && exit 1)

  # ── Arrancar Spark Master y Worker ───────────────────────────────────
  - systemctl enable spark-master.service
  - systemctl start spark-master.service

  # Esperar a que el Master esté activo en puerto 7077 (máx 30 s)
  - |
    for i in $$(seq 1 30); do
      ss -tlnp | grep -q ':7077' && break
      sleep 1
    done

  - systemctl enable spark-worker.service
  - systemctl start spark-worker.service

final_message: |
  Spark VM lista.
  Spark Master UI: http://SPARK_PUBLIC_IP:8080
  Spark Master URL (para .env del backend): spark://SPARK_PRIVATE_IP:7077
  Logs: journalctl -u spark-master -u spark-worker -f
  Bucket montado en: /mnt/data/
